name: build

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libegl1 libgl1 libdbus-1-3 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 xvfb
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Engine must stay headless
        run: |
          python - <<'PY'
          import sys
          import cytolux.engine, cytolux.transforms, cytolux.wsp
          qt = [m for m in sys.modules if "PySide6" in m or "pyqtgraph" in m]
          assert not qt, "GUI leaked into the engine: %s" % qt
          print("engine is headless")
          PY
      - name: Tests
        run: xvfb-run -a pytest -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Cytolux-windows
            sep: ";"
            icon: cytolux/icons/cytolux.ico
          - os: macos-latest
            artifact: Cytolux-macos-arm64
            sep: ":"
            icon: cytolux/icons/cytolux.icns
          # Built on the oldest runner still supported, deliberately. A binary linked
          # against the newest glibc refuses to start on anything older, and ubuntu-latest
          # produced one that needed GLIBC 2.43: unusable on 22.04 and 24.04, which is
          # most people. Building old runs new; building new does not run old.
          - os: ubuntu-22.04
            artifact: Cytolux-linux
            sep: ":"
            icon: cytolux/icons/app/cytolux-256.png
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Read the version from pyproject.toml
        id: ver
        shell: bash
        run: |
          v=$(python -c "import cytolux;print(cytolux.__version__)")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building version $v"
      - name: Build
        run: >
          pyinstaller --noconfirm --clean --windowed --name Cytolux
          --icon "${{ matrix.icon }}"
          --add-data "cytolux/icons${{ matrix.sep }}cytolux/icons"
          --collect-all flowkit
          --hidden-import openpyxl
          --hidden-import pyqtgraph
          run_cytolux.py
      - name: Qt runtime libraries (Linux runner only)
        if: runner.os == 'Linux'
        # A bare runner has no libEGL, so the binary cannot even import PySide6 and the
        # smoke test below would fail on the runner rather than on the build. A Linux
        # desktop already has these; they are listed in the evaluation README.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libfreetype6 libxcb-cursor0 libxcb-xinerama0
      - name: Smoke test the binary
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          CYTOLUX_SELFTEST: "1"
        run: |
          if [ -d "dist/Cytolux.app" ]; then
            ./dist/Cytolux.app/Contents/MacOS/Cytolux
          elif [ -f "dist/Cytolux/Cytolux.exe" ]; then
            ./dist/Cytolux/Cytolux.exe
          else
            ./dist/Cytolux/Cytolux
          fi

      # ---------------------------------------------------------------- installers
      # The steps above produce a folder someone has to know what to do with. These
      # produce the one file per platform that a person double-clicks.

      - name: Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: cmd
        # iscc ships with the windows-latest image, so there is nothing to install.
        run: iscc /DAppVersion=${{ steps.ver.outputs.version }} packaging\cytolux.iss

      - name: macOS disk image
        if: runner.os == 'macOS'
        run: packaging/make_dmg.sh "${{ steps.ver.outputs.version }}"

      - name: Linux AppImage
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -qq zsync desktop-file-utils
          packaging/make_appimage.sh "${{ steps.ver.outputs.version }}"

      - name: Checksum the installer
        shell: bash
        run: |
          cd installer
          for f in *; do
            case "$f" in *.sha256) continue;; esac
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$f" > "$f.sha256"
            else
              shasum -a 256 "$f" > "$f.sha256"
            fi
          done
          ls -lh

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-installer
          path: installer/
          retention-days: 90

      - name: Upload the unpacked bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          retention-days: 30

  # A tag starting with v publishes the three installers as a GitHub release, so
  # the download links are permanent instead of 90-day CI artifacts.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Collect the installers
        uses: actions/download-artifact@v4
        with:
          pattern: "*-installer"
          path: installers
          merge-multiple: true
      - name: What we are about to publish
        run: ls -lhR installers
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
          draft: false
          body: |
            ## Install

            | Platform | File | How |
            |---|---|---|
            | Windows 10/11, 64-bit | `Cytolux-*-windows-x64-setup.exe` | Run it. Installs per-user, so no administrator password. Windows SmartScreen will warn that the publisher is unknown: choose More info, then Run anyway. |
            | macOS, Apple silicon | `Cytolux-*-macos-arm64.dmg` | Open it and drag Cytolux to Applications. The build is ad-hoc signed, not notarized, so the first launch needs a right-click then Open. |
            | Linux, x86_64 | `Cytolux-*-x86_64.AppImage` | `chmod +x` it and run it. Add `--install` once to put it in the applications menu. |

            Each file has a matching `.sha256` for verification.

            Neither the Windows nor the macOS build carries a paid code-signing
            certificate, which is why both operating systems warn on first launch.
